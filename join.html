<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابدأ مع Ecoway | Ecoway Men Products</title>
  <meta name="description" content="انضم كشريك مع Ecoway — سجّل بياناتك وابدأ بناء فريقك وزيادة مبيعاتك بالتسويق بالعمولة.">
  <meta name="theme-color" content="#0C0C0C">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <h1 class="page-title">ابدأ مع Ecoway</h1>
    <p class="join-intro">سجّل بياناتك للانضمام كشريك وبناء فريقك معنا. سنراجع طلبك ونتواصل معك في أقرب وقت.</p>

    <div id="join-success" class="order-success hidden">
      <div class="order-success__icon">✓</div>
      <h2>تم تسجيل بياناتك بنجاح. سيتم التواصل في أقرب وقت</h2>
      <a href="index.html" class="btn btn--primary mt-16">العودة للرئيسية</a>
    </div>

    <form id="joinForm" class="join-form checkout-form" novalidate>
      <div class="form-group">
        <label for="fullName">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            الاسم
          </span>
          <span class="required">*</span>
        </label>
        <input type="text" id="fullName" name="fullName" required autocomplete="name" placeholder="أدخل اسمك الكامل">
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <label for="phone">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            رقم التواصل (هاتف + واتساب)
          </span>
          <span class="required">*</span>
        </label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="01xxxxxxxxx" dir="ltr">
        <span class="form-error"></span>
      </div>

      <div class="form-row form-row--birth">
        <div class="form-group">
          <label for="birthYear">
            <span class="field-label">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              سنة الميلاد
            </span>
            <span class="required">*</span>
          </label>
          <select id="birthYear" name="birthYear" required>
            <option value="">اختر السنة</option>
          </select>
          <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label for="age">
            <span class="field-label">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              السن
            </span>
          </label>
          <input type="text" id="age" name="age" readonly tabindex="-1" value="" aria-live="polite">
        </div>
      </div>

      <div class="form-group">
        <label for="governorate">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            المحافظة
          </span>
          <span class="required">*</span>
        </label>
        <select id="governorate" name="governorate" required>
          <option value="">اختر المحافظة</option>
        </select>
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <span class="form-label-text">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
            لديك خبرة بالتسويق؟
          </span>
          <span class="required">*</span>
        </span>
        <div class="radio-row" role="radiogroup" aria-label="خبرة التسويق">
          <label class="radio-chip">
            <input type="radio" name="hasMarketingExp" value="yes" required>
            <span>نعم</span>
          </label>
          <label class="radio-chip">
            <input type="radio" name="hasMarketingExp" value="no" required>
            <span>لا</span>
          </label>
        </div>
        <span class="form-error" id="expError"></span>
      </div>

      <div class="form-group hidden" id="experienceBioGroup">
        <label for="experienceBio">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            نبذة عن الخبرة
          </span>
          <span class="required">*</span>
        </label>
        <textarea id="experienceBio" name="experienceBio" rows="3" placeholder="اكتب نبذة سريعة عنها"></textarea>
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <label for="preferredTime">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            أفضل وقت للتواصل
          </span>
          <span class="required">*</span>
        </label>
        <select id="preferredTime" name="preferredTime" required>
          <option value="">اختر الوقت المناسب</option>
        </select>
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <label for="notes">
          <span class="field-label">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            ملاحظات
          </span>
        </label>
        <textarea id="notes" name="notes" rows="2" placeholder="أي ملاحظات إضافية (اختياري)"></textarea>
      </div>

      <button type="submit" class="btn btn--primary btn--block btn--lg">تسجيل</button>
    </form>
  </main>

  <div id="site-footer"></div>
  <div id="mobile-bottom-nav"></div>
  <div id="whatsapp-btn"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/join-page.js"></script>
</body>
</html>
